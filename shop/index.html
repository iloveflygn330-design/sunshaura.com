<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ページ間遷移の到着判定（全ページ共通。説明は assets/page-transition.js） -->
  <script>try{var t=+sessionStorage.getItem('sun-transition');if(t&&Date.now()-t<15000)document.documentElement.classList.add('is-arriving')}catch(e){}</script>
  <title>ショップ | sunshaura.com</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
  <!-- サイト共通（ヘッダー・フッター・ページ移動の演出） -->
  <link rel="stylesheet" href="../assets/site-common.css">
  <!-- ショップ専用の見た目 -->
  <link rel="stylesheet" href="assets/shop.css">
</head>
<!--
  ショップページ（shop/index.html）
  BOOTH で扱っている商品を、1画面に1つずつ紹介する。スクロールしないページ。

    assets/shop-data.js … ★拡張予定: 商品の一覧と動きの時間（商品を増やすときはここに1件追加）
    assets/shop.js      … 切り替えの動き・動画の再生・?id= の処理
    assets/shop.css     … 見た目（ウィンドウの色・位置、背景のぼかしの強さ）
    assets/icons/       … 商品情報ウィンドウのアイコン（link / coin / cloud）
    items/<商品ID>/     … 商品ごとの素材（自動生成。手で触らない。作り方は .github/scripts/shop-build.js）

  ★拡張予定: 商品を追加する手順は assets/shop-data.js の先頭に書いてある
  ※ 中身は shop.js が組み立てるので、このファイルは基本的に書き換えなくてよい
-->
<body class="site-page shop-page" data-transition-manual-ready>

  <!-- ヘッダー（中身は assets/site-header.js が全ページ共通で組み立てる） -->
  <header id="header"></header>

  <!-- ページ間遷移アニメーション用（全ページ共通の構成。動きは assets/page-transition.js） -->
  <div id="loading-bar" aria-live="polite"><span id="loading-bar-text"></span></div>
  <div id="loading-panel" aria-hidden="true">
    <div id="panel-icon"></div><!-- アイコンは assets/page-transition.js が入れる -->
    <div id="panel-message">ちょっとまってね...</div>
  </div>

  <main id="body-content" data-transition-body>
    <section id="shop-stage" aria-roledescription="商品紹介" aria-label="ショップ">
      <!-- 背景（ぼかし） -->
      <div id="shop-bg-wrap" class="shop-bg-wrap shop-move"><div id="shop-bg" class="shop-bg"></div></div>

      <!-- キャラクター（静止画の上にフェードイン / フェードアウト動画を重ねる） -->
      <div id="shop-chara" class="shop-chara shop-move">
        <div class="shop-chara-box">
          <img id="shop-idle" class="is-hidden" alt="">
          <video id="shop-vin" muted playsinline preload="auto"></video>
          <video id="shop-vout" muted playsinline preload="auto"></video>
        </div>
      </div>

      <!-- 商品情報ウィンドウ（中身は shop.js が入れる） -->
      <article id="shop-window" class="shop-window shop-move" aria-live="polite"></article>

      <!-- 切り替えボタン -->
      <button id="shop-prev" class="shop-nav shop-nav-prev" aria-label="前の商品">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13 3 6 10l7 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="shop-next" class="shop-nav shop-nav-next" aria-label="次の商品">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <!-- 何番目かの表示（点 または「3 / 12」。shop.js が入れる） -->
      <div id="shop-pager" class="shop-pager"></div>
    </section>
  </main>

  <!-- フッター（中身は assets/site-header.js の SITE_FOOTER_HTML。全ページ共通） -->
  <footer class="site-footer" data-site-footer>sunshaura.com</footer>

  <script src="../assets/page-transition.js"></script>
  <script src="../assets/site-header.js"></script>
  <script>SunHeader.render({ root: '../', current: 'shop' });</script>
  <script src="assets/shop-data.js"></script>
  <script src="assets/shop.js"></script>
</body>
</html>
