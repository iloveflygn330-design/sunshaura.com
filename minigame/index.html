<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- アクセス解析（Google アナリティクス。設定・自分のアクセスを数えない方法は assets/analytics.js） -->
  <script src="../assets/analytics.js"></script>
  <!-- ページ間遷移の到着判定（全ページ共通。説明は assets/page-transition.js） -->
  <script>try{var t=+sessionStorage.getItem('sun-transition');if(t&&Date.now()-t<15000)document.documentElement.classList.add('is-arriving')}catch(e){}</script>
  <title>ミニゲーム | sunshaura.com</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
  <!-- サイト共通（ヘッダー・フッター・ページ移動の演出） -->
  <link rel="stylesheet" href="../assets/site-common.css">
  <!-- このページ専用の見た目 -->
  <link rel="stylesheet" href="assets/minigame.css">
  <!-- 恐竜ボイスゲームの見た目 -->
  <link rel="stylesheet" href="assets/dinovoice.css">
</head>
<!--
  ミニゲームページ（minigame/index.html）
    ゲームの動きは assets/minigame.js、見た目は assets/minigame.css。
    ヘッダー・フッター・「ちょっとまってね...」の演出は共通パーツ（assets/site-header.js / assets/page-transition.js）。
-->
<body class="site-page">

  <!-- ヘッダー（中身は assets/site-header.js が全ページ共通で組み立てる） -->
  <header id="header"></header>

  <!-- ページ間遷移アニメーション用（全ページ共通の構成。動きは assets/page-transition.js） -->
  <div id="loading-bar" aria-live="polite"><span id="loading-bar-text"></span></div>
  <div id="loading-panel" aria-hidden="true">
    <div id="panel-icon"></div><!-- アイコンは assets/page-transition.js が入れる -->
    <div id="panel-message">ちょっとまってね...</div>
  </div>

  <main id="body-content" data-transition-body>
    <div id="minigame-inner">

      <!-- ゲーム選択画面 -->
      <div class="mg-screen active" id="mg-select">
        <p class="mg-select-title">遊びたいミニゲームを選んでね！</p>
        <!--
          ★拡張予定: ゲームを追加する場合
            1. 下に <button class="mg-game-card" onclick="mgStartGame('ゲームID')"> を追記
            2. 対応する <div class="mg-screen" id="mg-ゲームID"> をこのページ内に追記
            3. mgStartGame() の switch にゲームIDを追記（初期化処理が必要な場合）
        -->
        <div id="mg-game-list">
          <button class="mg-game-card" onclick="mgStartGame('shooting')">
            <span class="mg-game-icon">🎯</span>
            <span class="mg-game-name">まとあてシューティング</span>
          </button>
          <button class="mg-game-card" onclick="mgStartGame('janken')">
            <span class="mg-game-icon">✊</span>
            <span class="mg-game-name">じゃんけんゲーム</span>
          </button>
          <button class="mg-game-card" onclick="mgStartGame('dinovoice')">
            <span class="mg-game-icon">🦕</span>
            <span class="mg-game-name">きょうりゅうボイス</span>
          </button>
        </div>
      </div>

      <!-- まとあてシューティング -->
      <div class="mg-screen" id="mg-shooting">
        <div class="mg-game-header">
          <button class="mg-back-btn" onclick="mgBackToSelect()">← ゲーム選択に戻る</button>
          <div class="mg-hud">
            <span>スコア: <b id="mg-sh-score">0</b></span>
            <span>残り時間: <b id="mg-sh-time">30</b>秒</span>
          </div>
        </div>
        <div id="mg-sh-field">
          <div id="mg-sh-start-overlay">
            <p>制限時間30秒！　出てくる的をクリックしてスコアを稼ごう！</p>
            <button class="mg-primary-btn" onclick="mgShootingStart()">スタート</button>
          </div>
          <div id="mg-sh-result-overlay" style="display:none">
            <p>タイムアップ！</p>
            <p>スコア：<span id="mg-sh-final-score">0</span></p>
            <button class="mg-primary-btn" onclick="mgShootingStart()">もう一度あそぶ</button>
          </div>
        </div>
      </div>

      <!-- じゃんけんゲーム -->
      <div class="mg-screen" id="mg-janken">
        <div class="mg-game-header">
          <button class="mg-back-btn" onclick="mgBackToSelect()">← ゲーム選択に戻る</button>
          <div class="mg-hud">
            <span>勝ち: <b id="mg-jk-win">0</b></span>
            <span>負け: <b id="mg-jk-lose">0</b></span>
            <span>あいこ: <b id="mg-jk-draw">0</b></span>
          </div>
        </div>
        <div id="mg-jk-field">
          <div class="mg-jk-battle">
            <div class="mg-jk-hand" id="mg-jk-cpu-hand">？</div>
            <span class="mg-jk-vs">VS</span>
            <div class="mg-jk-hand" id="mg-jk-player-hand">？</div>
          </div>
          <p id="mg-jk-message">手を選んでね！</p>
          <div class="mg-jk-buttons">
            <button class="mg-jk-btn" onclick="mgJankenPlay('rock')">✊<br>グー</button>
            <button class="mg-jk-btn" onclick="mgJankenPlay('scissors')">✌️<br>チョキ</button>
            <button class="mg-jk-btn" onclick="mgJankenPlay('paper')">✋<br>パー</button>
          </div>
        </div>
      </div>

      <!--
        恐竜ボイスゲーム
          動きは assets/dinovoice.js、恐竜・セリフ・調整値は assets/dinovoice-data.js、見た目は assets/dinovoice.css。
          音声素材は minigame/dinovoice/sounds/（説明は同じフォルダの README.txt）。
      -->
      <div class="mg-screen" id="mg-dinovoice">
        <div class="mg-game-header">
          <button class="mg-back-btn" onclick="mgBackToSelect()">← ゲーム選択に戻る</button>
          <div class="mg-hud"><span>のこり: <b id="dv-tries"></b></span></div>
        </div>

        <div id="dv-field">
          <!-- スタート画面（ブラウザは操作のあとでないと音を出せないので、ボタンを押してから読み込む） -->
          <div id="dv-start-overlay">
            <p>仲間の恐竜が鳴いているよ！<br>同じ声で返事をして、どの恐竜か当ててね。<br>つまみをさわると自分の声が出るよ。</p>
            <button class="mg-primary-btn" id="dv-start-btn" onclick="dvStart()">スタート</button>
            <p id="dv-loading" style="display:none">声を準備中...</p>
          </div>

          <!-- 恐竜とずんだもんの吹き出し -->
          <div id="dv-stage">
            <p id="dv-bubble"></p>
            <div id="dv-dino-wrap">
              <div id="dv-dino"></div>
              <!-- 遊んでいる間は恐竜を草むらで隠す（結果が出たら消えて、シルエット → 色付きの順に公開） -->
              <div id="dv-cover" aria-hidden="true">
                <svg viewBox="0 0 400 280">
                  <g fill="#5FAF4A">
                    <circle cx="70" cy="215" r="60"/><circle cx="150" cy="170" r="80"/><circle cx="250" cy="165" r="85"/>
                    <circle cx="335" cy="210" r="62"/><rect x="20" y="210" width="360" height="62" rx="20"/>
                  </g>
                  <g fill="#4A9638"><circle cx="110" cy="235" r="40"/><circle cx="290" cy="232" r="44"/></g>
                  <text x="200" y="205" text-anchor="middle" font-size="96" font-weight="800" fill="#FFFFFF" opacity=".9">？</text>
                </svg>
              </div>
            </div>
            <p id="dv-name">？？？</p>
          </div>

          <!-- 声を聴くボタン -->
          <div class="dv-voice-row">
            <button class="dv-voice-btn" id="dv-model-btn" onclick="dvPlayVoice('model')">🔊 お手本のこえ</button>
            <button class="dv-voice-btn" id="dv-player-btn" onclick="dvPlayVoice('player')">🗣 自分のこえ</button>
          </div>

          <!-- 声を調整するつまみ -->
          <div id="dv-controls">
            <div class="dv-pad-wrap">
              <span class="dv-ctl-label">口の形（さわると声が出る）</span>
              <div id="dv-pad"><span id="dv-pad-knob"></span></div>
            </div>
            <div class="dv-sliders">
              <label class="dv-slider">
                <span class="dv-ctl-label">喉の長さ</span>
                <input type="range" id="dv-throat" min="0" max="1" step="0.01">
                <span class="dv-slider-ends"><span>みじかい（高い）</span><span>ながい（低い）</span></span>
              </label>
              <label class="dv-slider">
                <span class="dv-ctl-label">口のとじ具合</span>
                <input type="range" id="dv-close" min="0" max="1" step="0.01">
                <span class="dv-slider-ends"><span>あける</span><span>とじる（ん）</span></span>
              </label>
              <label class="dv-slider">
                <span class="dv-ctl-label">息</span>
                <input type="range" id="dv-breath" min="0" max="1" step="0.01">
                <span class="dv-slider-ends"><span>はっきり</span><span>ささやき</span></span>
              </label>
            </div>
          </div>

          <div class="dv-answer-row">
            <button class="mg-primary-btn" id="dv-answer-btn" onclick="dvAnswer()">返事をする（答え合わせ）</button>
            <button class="mg-primary-btn" id="dv-again-btn" onclick="dvNewRound()" style="display:none">もう一回あそぶ</button>
          </div>
          <div id="dv-result" aria-live="polite"></div>

          <p id="dv-fallback-note" style="display:none">※ 声の素材がまだないので、仮の音で鳴っています</p>
          <!-- 音源規約でクレジット表記が必要（文字は dinovoice-data.js の DV_SETTINGS.credit） -->
          <p id="dv-credit"></p>
        </div>
      </div>

    </div><!-- /#minigame-inner -->
  </main>

  <!-- フッター（中身は assets/site-header.js の SITE_FOOTER_HTML。全ページ共通） -->
  <footer class="site-footer" data-site-footer>sunshaura.com</footer>

  <script src="../assets/page-transition.js"></script>
  <script src="../assets/site-header.js"></script>
  <script>SunHeader.render({ root: '../', current: 'minigame' });</script>

  <!-- ミニゲーム本体 -->
  <script src="assets/minigame.js"></script>
  <!-- 恐竜ボイスゲーム（データ → 動きの順で読み込む） -->
  <script src="assets/dinovoice-data.js"></script>
  <script src="assets/dinovoice.js"></script>
</body>
</html>
