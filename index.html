<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- アクセス解析（Google アナリティクス。設定・自分のアクセスを数えない方法は assets/analytics.js） -->
  <script src="assets/analytics.js"></script>
  <!--
    昔のURL（index.html#avatar など）で来た人を、新しいページ（avatar/ など）へ転送する
      以前は1つの index.html の中でページを切り替えていて、ニュースなどから「index.html#ページID」で戻っていた。
      いまは各ページが別のフォルダ（avatar/ world/ …）にあるので、ブックマーク等の古いURLをここで振り分ける。
      ★拡張予定: 転送先を増やす必要はない（assets/site-header.js の SITE_NAV_ITEMS の id と一致すれば自動で転送）。
        ただし SITE_NAV_ITEMS はまだ読み込まれていないので、下の OLD_PAGES に古いページIDを書いておく。
  -->
  <script>
    (function () {
      var OLD_PAGES = ['avatar', 'world', 'shop', 'event', 'minigame', 'about'];
      var id = decodeURIComponent(location.hash.slice(1));
      if (OLD_PAGES.indexOf(id) >= 0) location.replace(id + '/');
    }());
  </script>
  <!--
    ページ間遷移の到着判定（assets/page-transition.js とセット）
      別のページから演出つきで移動してきた場合だけ、
      画面が表示される前に <html class="is-arriving"> を付けて、パネルで覆った状態から始める。
      ※ 表示前に判定する必要があるため、ファイルを分けずに <head> に直接書いている（全ページ共通）
  -->
  <script>try{var t=+sessionStorage.getItem('sun-transition');if(t&&Date.now()-t<15000)document.documentElement.classList.add('is-arriving')}catch(e){}</script>
  <title>sunshaura.com</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
  <!-- GSAP + ScrollTrigger（CDN） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <!-- サイト共通（ヘッダー・フッター・ページ移動の演出） -->
  <link rel="stylesheet" href="assets/site-common.css">
  <!-- トップページ（ようこそ）専用の見た目 -->
  <link rel="stylesheet" href="assets/welcome.css">
</head>
<!--
  トップページ（ようこそ）

  サイトの構成（ページごとに HTML を分けている）
    index.html          … このページ（ようこそ）。動きは assets/welcome.js、見た目は assets/welcome.css
    avatar/index.html   … アバター改変
    world/index.html    … 作ったワールド
    shop/index.html     … ショップ
    gallery/index.html  … フォトギャラリー
    event/index.html    … イベント
    minigame/index.html … ミニゲーム
    about/index.html    … このサイトについて
    news/index.html     … ニュース

  全ページ共通のパーツ
    assets/site-header.js    … ヘッダー（ロゴ・ナビボタン）とフッターの中身。ボタンの追加はここだけ
    assets/site-common.css   … ヘッダー・フッター・ページ移動の演出の見た目、サイト共通の色
    assets/page-transition.js … ページ移動の「ちょっとまってね...」→「おまたせ！」演出

  ★拡張予定: 新しいページを追加する手順
    1. world/ フォルダをコピーして、フォルダ名を新しいページ名にする（中身は index.html だけ）
    2. コピーした index.html の <title> と SunHeader.render の current を新しいページ名にする
    3. assets/site-header.js の SITE_NAV_ITEMS に1行追加する（全ページのヘッダーにボタンが出る）
-->
<body>

  <!-- ヘッダー（中身は assets/site-header.js が全ページ共通で組み立てる） -->
  <header id="header"></header>

  <!-- ページ間遷移アニメーション用（全ページ共通の構成。動きは assets/page-transition.js） -->
  <div id="loading-bar" aria-live="polite"><span id="loading-bar-text"></span></div>
  <div id="loading-panel" aria-hidden="true">
    <div id="panel-icon"></div><!-- アイコンは assets/page-transition.js が入れる -->
    <div id="panel-message">ちょっとまってね...</div>
  </div>

  <main id="body-content" data-transition-body>

    <div id="page-welcome">
      <!-- 専用スクロールコンテナ: GSAPのscrollerとして使用（windowと分離） -->
      <div id="wlc-scroll">

      <!-- =====================================================
           セクション1: ようこそ（初期表示 + 時間差フェードイン）
           ===================================================== -->
      <section class="wlc-sec1" id="wlc-sec1">

        <!-- ① ようこそ！タイトル（初期から表示） -->
        <h1 class="wlc-title" id="wlc-title">ようこそ！🌸</h1>

        <!-- ② メインキャッチコピー（0.4秒後フェードイン） -->
        <p class="wlc-catch" id="wlc-catch">
          初めてこのページにアクセスした人は、<br>
          スクロールしてこの続きを読んでみてください。
        </p>

        <!-- ③ 注意書き + 下矢印（0.7秒後フェードイン） -->
        <p class="wlc-note" id="wlc-note">
          ※このページにはVRChat向けコンテンツが多数用いられます。<br>
          特記がないものは全て、シャウラ製ではございません。<br>
          <!-- クレジットは「このサイトについて」ページ（about/）にまとめている -->
          各コンテンツに関しては、<a href="about/" data-transition>クレジット</a>をご参照ください。
        </p>
        <span class="wlc-arrows" id="wlc-arrows">↓↓↓↓</span>

      </section>

      <!-- =====================================================
           セクション2: 自己紹介（スクロール連動アニメ）
           sticky レイアウト: .wlc-sec2 がスクロール量を確保し
           .wlc-sec2-sticky が画面に貼りついて表示される
           ===================================================== -->
      <section class="wlc-sec2" id="wlc-sec2">
        <div class="wlc-sec2-sticky" id="wlc-sec2-sticky">

          <!-- テキストボックス①（左から滑り込む。②は assets/welcome.js が作る） -->
          <div class="wlc-textbox" id="wlc-textbox">
            <p class="wlc-textbox-title">こんにちは！</p>
            <p class="wlc-textbox-body">
              <!--
                ★拡張予定: 自己紹介テキストの編集
                  .wlc-textbox-line を1行＝1要素として追記・編集する。
                  各行は ScrollTrigger で上から順番にフェードインする。
                  行を増やす場合は <span class="wlc-textbox-line">テキスト</span>
                  を末尾に追加するだけ。
              -->
              <span class="wlc-textbox-line">私はシャウラと申します。</span>
              <span class="wlc-textbox-line">&nbsp;</span>
              <span class="wlc-textbox-line">まめひなたに心酔し、</span>
              <span class="wlc-textbox-line">まめひなたばかり使う</span>
              <span class="wlc-textbox-line">VRChatプレイヤーです。</span>
            </p>
            <div class="wlc-textbox-lines">
              <div class="wlc-textbox-bar"></div>
              <div class="wlc-textbox-bar"></div>
              <div class="wlc-textbox-bar"></div>
            </div>
          </div>

          <!--
            キャラクター①（左から傾いて現れる）・②（右から傾いて現れる）
              画像は assets/images/welcome/left/ と right/ からランダムに1枚ずつ（assets/welcome.js が入れる）
              ★拡張予定: キャラクターを増やす → それぞれのフォルダに透過 PNG を入れるだけ（手順は assets/images/welcome/README.md）
          -->
          <div class="wlc-char wlc-char-l" id="wlc-char-l" aria-hidden="true"></div>
          <div class="wlc-char wlc-char-r" id="wlc-char-r" aria-hidden="true"></div>

        </div><!-- /.wlc-sec2-sticky -->
        <!-- 見えない余白：ここをスクロールしている間、上のエリアが画面に貼りついたままアニメーションが進む（長さは welcome.css の --wlc-sec2-run） -->
        <div class="wlc-sec2-runway" id="wlc-sec2-runway" aria-hidden="true"></div>
      </section><!-- /.wlc-sec2 -->

      <!-- =====================================================
           セクション3: 最後の画面（見出し + キャラクター③ + フッター）
           ===================================================== -->
      <section class="wlc-sec3" id="wlc-sec3">

        <!-- 見出し（下からスライドイン） -->
        <p class="wlc-sec3-title" id="wlc-sec3-title">
          <!-- ★拡張予定: スマホだけで改行したい位置には <br class="wlc-sp-br"> を入れる -->
          まずは、<br class="wlc-sp-br">アバター改変などを<br class="wlc-sp-br">見てみてください
        </p>

        <!--
          キャラクター③（いちばん下までスクロールすると、フッターの下から順番にスライドインする）
            画像は assets/images/welcome/footer/ からランダムに選ぶ（PC は4人・スマホは2人。assets/welcome.js が入れる）
            ★拡張予定: キャラクターを増やす → assets/images/welcome/footer/ に透過 PNG を入れるだけ
        -->
        <div class="wlc-foot-chars" id="wlc-foot-chars" aria-hidden="true"></div>

      </section>

      <!--
        フッター（中身は assets/site-header.js の SITE_FOOTER_HTML。全ページ共通）
        トップページだけは、スクロールする箱（#wlc-scroll）の一番下に置いている。
        ★拡張予定: フッターにリンクや著作権表記を追加する場合は assets/site-header.js の SITE_FOOTER_HTML を書き換える
      -->
      <footer class="site-footer" id="wlc-footer" data-site-footer>sunshaura.com</footer>

      </div><!-- /#wlc-scroll -->
    </div><!-- /#page-welcome -->

  </main>

  <script src="assets/page-transition.js"></script>
  <script src="assets/site-header.js"></script>
  <script>SunHeader.render({ root: './' });</script>
  <!-- ようこそページのスクロールアニメーション（GSAP ScrollTrigger） -->
  <script src="assets/welcome.js"></script>
</body>
</html>
