# =====================================================
# フォトギャラリー：軽量版画像と写真一覧を自動で作る
#
# 仕組み:
#   gallery/photos/ に写真を push すると、このワークフローが動いて
#     ・gallery/generated/thumb/ … 並べて表示する用の軽い WebP（横960px）
#     ・gallery/generated/large/ … 拡大表示用の WebP（長辺2000px）
#     ・gallery/data/photos.json … ギャラリーが読む写真の一覧
#   を作り、main ブランチに自動でコミットする。
#   処理の中身は .github/scripts/gallery-build.js。
#
# 事前設定: 基本的に不要（下の permissions: contents: write で自動コミットできる）
#   もし「変更があればコミットする」で 403 エラーになったら、
#   Settings → Actions → General → Workflow permissions を「Read and write permissions」にする
#
# 動いたかどうかの確認:
#   リポジトリの Actions タブ → 「Gallery build」。緑のチェックなら成功。
#   失敗していてもギャラリーは元の画像で表示されるので、表示が止まることはない。
#
# ★拡張予定: 全部の軽量版を作り直したいとき（大きさや画質を変えたとき）
#   Actions タブ → Gallery build → Run workflow で「作り直す」にチェックを入れて実行する。
#   大きさ・画質は .github/scripts/gallery-build.js の SIZES で変える。
# =====================================================
name: Gallery build

on:
  push:
    branches: [main]
    paths:
      - 'gallery/photos/**'
      - '.github/scripts/gallery-build.js'
      - '.github/workflows/gallery-build.yml'
  workflow_dispatch:
    inputs:
      force:
        description: '作り直す（すべての軽量版を作り直す）'
        type: boolean
        default: false

permissions:
  contents: write

# 続けて push したときに、同時に2つ動いてぶつからないようにする（順番に実行）
concurrency:
  group: gallery-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 画像変換ライブラリ（sharp）を入れる
        working-directory: .github/scripts
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.33.5

      - name: 軽量版画像と一覧を作る
        env:
          GALLERY_FORCE: ${{ github.event.inputs.force || 'false' }}
        run: node .github/scripts/gallery-build.js

      - name: 変更があればコミットする
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A gallery/generated gallery/data/photos.json
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "フォトギャラリー: 軽量版画像と写真一覧を自動更新"
          # 実行中に別の push があっても失敗しないよう、最新を取り込んでから push する
          git pull --rebase origin main
          git push origin HEAD:main
