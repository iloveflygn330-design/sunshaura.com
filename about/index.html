<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- アクセス解析（Google アナリティクス。設定・自分のアクセスを数えない方法は assets/analytics.js） -->
  <script src="../assets/analytics.js"></script>
  <!-- ページ間遷移の到着判定（全ページ共通。説明は assets/page-transition.js） -->
  <script>try{var t=+sessionStorage.getItem('sun-transition');if(t&&Date.now()-t<15000)document.documentElement.classList.add('is-arriving')}catch(e){}</script>
  <title>このサイトについて | sunshaura.com</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
  <!-- サイト共通（ヘッダー・フッター・ページ移動の演出） -->
  <link rel="stylesheet" href="../assets/site-common.css">
  <!-- このページ専用の見た目 -->
  <link rel="stylesheet" href="assets/about.css">
</head>
<!--
  このサイトについてページ（about/index.html）
    プロフィールカードと、その後ろに並ぶクレジット。

  しくみ:
    ・最初はプロフィールカードが大きく真ん中に出て、その後ろにクレジットの文字が並ぶ
    ・カードのリンク以外をクリック → カードが小さくなり、ドラッグで動かせる
        持ったまま振り回すと、つかんだ位置を軸にくるくる回る / 勢いをつけて離すと飛んでいく
        壁（この領域の端・スマホは今見えている画面の端）で跳ね返りながら減速する
        ぶつかったクレジットの文字は、1行ずつの塊のまま飛び散る
    ・カードが止まって10秒たつと、文字はふわっと元の位置へ戻る（「元に戻す」ボタンでもすぐ戻せる）
    ・小さいカードをダブルクリック（スマホはダブルタップ）→ 真ん中に戻って大きくなる
    ・スマホは、カード以外のところを左右になぞるとクレジットを横にスクロールできる
    ・OS の「視差効果を減らす（動きを減らす）」がオンの人には、動きを止めて普通の並びだけ見せる

  中身（プロフィール・クレジット・動きの数値）は about/assets/about-data.js にまとめてある。
  ★拡張予定: プロフィールやクレジットを変える・増やす → about/assets/about-data.js を書き換える（このHTMLは触らなくてよい）
  動きは about/assets/about.js、見た目は about/assets/about.css。
  物理演算は Matter.js（cdnjs から読み込み。about.js が必要なときだけ読み込む）。
-->
<body class="site-page about-page">

  <!-- ヘッダー（中身は assets/site-header.js が全ページ共通で組み立てる） -->
  <header id="header"></header>

  <!-- ページ間遷移アニメーション用（全ページ共通の構成。動きは assets/page-transition.js） -->
  <div id="loading-bar" aria-live="polite"><span id="loading-bar-text"></span></div>
  <div id="loading-panel" aria-hidden="true">
    <div id="panel-icon"></div><!-- アイコンは assets/page-transition.js が入れる -->
    <div id="panel-message">ちょっとまってね...</div>
  </div>

  <main id="body-content" data-transition-body>
    <h1 class="about-visually-hidden">このサイトについて</h1>

    <!-- カードが動き回る領域（この領域の端が「壁」になる） -->
    <div class="about-stage" id="about-stage">

      <!-- クレジット（中身は about-data.js の ABOUT_CREDITS から about.js が作る）
           スマホではこの箱が横にスクロールする -->
      <div class="about-scroller" id="about-scroller">
        <div class="about-credits" id="about-credits">
          <div class="about-col about-col-left" id="about-col-left"></div>
          <div class="about-col-gap" aria-hidden="true"></div>
          <div class="about-col about-col-right" id="about-col-right"></div>
        </div>
      </div>

      <!-- プロフィールカード（中身は about-data.js の ABOUT_PROFILE から about.js が作る） -->
      <section class="about-card" id="about-card" aria-label="プロフィール">
        <div class="about-card-inner" id="about-card-inner"></div>
      </section>

      <!-- 散らばった文字をすぐ元に戻すボタン（散らばっているときだけ出る） -->
      <button type="button" class="about-reset" id="about-reset" hidden>元に戻す</button>

      <!-- 操作のヒント（カードを小さくすると消える） -->
      <p class="about-hint" id="about-hint">カードをクリックすると、つかんで投げられます</p>
    </div>
  </main>

  <!-- フッター（中身は assets/site-header.js の SITE_FOOTER_HTML。全ページ共通） -->
  <footer class="site-footer" data-site-footer>sunshaura.com</footer>

  <script src="../assets/page-transition.js"></script>
  <script src="../assets/site-header.js"></script>
  <script>SunHeader.render({ root: '../', current: 'about' });</script>
  <script src="assets/about-data.js"></script>
  <script src="assets/about.js"></script>
</body>
</html>
