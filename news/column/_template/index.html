<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ニュース | sunshaura.com</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/news.css">
</head>
<!--
  ニュース 記事ページ（テンプレート）

  このファイルは全記事で共通。毎日の記事作成では、
    news/column/_template/index.html を
    news/column/YYYYMM/DD/index.html にそのままコピーし、
    同じフォルダに article.json（記事の中身）を置くだけでよい。
  このHTML自体を記事ごとに書き換える必要はない。

    data-news-page="article"     : news.js に記事ページとして描画させる
    data-news-root="../../../"   : このHTMLから news/ フォルダへの相対パス
                                   （column/YYYYMM/DD/ の3階層ぶん戻る）

  ★拡張予定: 記事ページのレイアウトを変えたい場合
    ・見た目だけ → news/assets/news.css を編集（全記事に反映される）
    ・表示項目   → news/assets/news.js の renderArticle() を編集
    ・このテンプレートを変えた場合は、過去の記事フォルダの index.html にも
      同じ内容を上書きコピーする（中身は全記事で同一なので一括コピーでOK）
-->
<body data-news-page="article" data-news-root="../../../">

  <header id="header"></header>

  <main id="news-body">
    <div class="news-layout">

      <div class="news-main">
        <article class="news-article" id="news-article">
          <p class="news-empty">読み込み中...</p>
        </article>
        <!-- 前の記事 / 一覧へ / 次の記事 -->
        <nav class="news-pager" id="news-pager"></nav>
      </div>

      <aside class="news-side" id="news-side"></aside>

    </div>
  </main>

  <footer class="news-footer">sunshaura.com</footer>

  <script src="../../../assets/news.js"></script>
</body>
</html>
